<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Luxury Hotels | Akshar Tours Admin</title>
  
  <link rel="icon" type="image/svg+xml" href="../assets/logos/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <a href="dashboard.html">
          <img src="../assets/logos/logo-white.svg" alt="Akshar Tours Admin" height="38">
        </a>
      </div>

      <div class="admin-sidebar-menu">
        <div class="admin-nav-category">Main Dashboard</div>
        <a href="dashboard.html" class="admin-nav-item">
          <i class="bi bi-speedometer2"></i>
          <span>Overview</span>
        </a>

        <div class="admin-nav-category">Inventory &amp; Tours</div>
        <a href="packages.html" class="admin-nav-item">
          <i class="bi bi-pin-map-fill"></i>
          <span>Tour Packages</span>
        </a>
        <a href="hotels.html" class="admin-nav-item active">
          <i class="bi bi-building"></i>
          <span>Luxury Hotels</span>
        </a>

        <div class="admin-nav-category">Operations</div>
        <a href="bookings.html" class="admin-nav-item">
          <i class="bi bi-ticket-perforated"></i>
          <span>Bookings &amp; Status</span>
        </a>
        <a href="customers.html" class="admin-nav-item">
          <i class="bi bi-people"></i>
          <span>Customers</span>
        </a>

        <div class="admin-nav-category">System</div>
        <a href="../index.html" target="_blank" class="admin-nav-item">
          <i class="bi bi-box-arrow-up-right"></i>
          <span>View Public Site</span>
        </a>
      </div>

      <div class="admin-sidebar-footer">
        <div class="admin-user-profile">
          <div class="admin-user-avatar">AD</div>
          <div class="flex-grow-1 overflow-hidden">
            <div class="fw-bold text-white small text-truncate">Administrator</div>
            <div class="text-white-50 small text-truncate">admin@akshartours.com</div>
          </div>
          <button class="btn btn-sm btn-link text-danger p-0" onclick="logoutUser('login.html')">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
      
      <!-- Top Navbar -->
      <header class="admin-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-light d-lg-none" type="button" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h5 class="fw-bold text-navy mb-0">Manage Luxury Hotels &amp; Resorts</h5>
        </div>

        <button class="btn btn-gold btn-sm" onclick="openAddHotelModal()">
          <i class="bi bi-plus-lg me-1"></i> Add New Hotel
        </button>
      </header>

      <!-- Body Content -->
      <div class="p-4 p-md-5">
        
        <div class="admin-table-card">
          <div class="admin-table-card-header">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-navy text-gold" id="admin-hotels-count">Loading...</span>
            </div>

            <div class="input-group" style="max-width: 280px;">
              <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
              <input type="text" id="admin-hotel-search" class="form-control form-control-sm" placeholder="Search hotel or city..." oninput="renderAdminHotelsTable(this.value)">
            </div>
          </div>

          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>Image</th>
                  <th>ID</th>
                  <th>Hotel Name &amp; Location</th>
                  <th>Stars</th>
                  <th>Nightly Rate</th>
                  <th>Rating</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-hotels-tbody">
                <!-- Injected by js/admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ADD / EDIT HOTEL MODAL -->
  <div class="modal fade" id="hotelModal" tabindex="-1" aria-labelledby="hotelModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow-lg">
        <div class="modal-header bg-navy text-white">
          <h5 class="modal-title fw-bold" id="hotelModalLabel">Add New Hotel</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="hotel-form" onsubmit="saveHotelForm(event)">
          <input type="hidden" name="hotelId" value="">
          
          <div class="modal-body p-4">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label fw-bold small text-navy">Hotel Name <span class="text-danger">*</span></label>
                <input type="text" name="hotelName" class="form-control" placeholder="e.g. The Taj Mahal Palace" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold small text-navy">Star Rating</label>
                <select name="hotelStars" class="form-select">
                  <option value="5" selected>5-Star Luxury</option>
                  <option value="4">4-Star Deluxe</option>
                  <option value="3">3-Star Comfort</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold small text-navy">Location / City <span class="text-danger">*</span></label>
                <input type="text" name="hotelLocation" class="form-control" placeholder="e.g. Colaba, Mumbai" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-navy">Country <span class="text-danger">*</span></label>
                <input type="text" name="hotelCountry" class="form-control" placeholder="e.g. India" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold small text-navy">Nightly Rate (₹ / night) <span class="text-danger">*</span></label>
                <input type="number" name="hotelPrice" class="form-control" min="1000" step="500" value="18000" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-navy">Photo Image URL</label>
                <input type="url" name="hotelImage" class="form-control" placeholder="https://images.unsplash.com/photo-...">
              </div>

              <div class="col-12">
                <label class="form-label fw-bold small text-navy">Hotel Description &amp; Highlights</label>
                <textarea name="hotelDescription" class="form-control" rows="3" placeholder="Describe the hotel property, dining, and scenic surroundings"></textarea>
              </div>
            </div>
          </div>

          <div class="modal-footer bg-light">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gold px-4 fw-bold">Save Hotel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/hotels.js"></script>
  <script src="../js/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAdminAuth('../');
      renderAdminHotelsTable();
    });
  </script>
</body>
</html>
