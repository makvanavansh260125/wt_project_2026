<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Akshar Tours &amp; Travels</title>
  
  <link rel="icon" type="image/svg+xml" href="../assets/logos/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-navy-deep d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-7 col-sm-10">
        
        <div class="text-center mb-4">
          <img src="../assets/logos/logo-white.svg" alt="Akshar Tours &amp; Travels" height="52">
          <div class="text-white-50 small mt-2">Executive Administration Control Portal</div>
        </div>

        <div class="card border-0 shadow-xl rounded-4 overflow-hidden bg-white">
          <div class="bg-navy p-4 text-center text-white border-bottom border-warning">
            <i class="bi bi-shield-lock-fill display-4 text-gold mb-2 d-block"></i>
            <h4 class="fw-bold mb-1">Staff &amp; Admin Sign In</h4>
            <div class="text-white-50 small">Manage packages, hotels, reservations &amp; inquiries</div>
          </div>

          <div class="card-body p-4 p-md-5">
            <div class="alert alert-warning py-2 px-3 mb-4 rounded-3 small">
              <i class="bi bi-info-circle-fill me-1"></i> Demo credentials: <code>admin@akshartours.com</code> / <code>admin123</code>
            </div>

            <form onsubmit="handleAdminLoginSubmit(event)">
              <div class="mb-3">
                <label class="form-label fw-bold small text-navy">Admin Email / Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="text" id="admin-user-input" class="form-control" placeholder="admin@akshartours.com" value="admin@akshartours.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold small text-navy">Admin Security Key / Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" id="admin-pass-input" class="form-control" placeholder="Enter password" value="admin123" required>
                </div>
              </div>

              <button type="submit" class="btn btn-navy btn-lg w-100 py-2 fw-bold mb-3">
                <i class="bi bi-box-arrow-in-right text-gold me-1"></i> Enter Control Panel
              </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
              <a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i> Return to Public Website</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    function handleAdminLoginSubmit(e) {
      e.preventDefault();
      const loginId = document.getElementById('admin-user-input').value.trim();
      const password = document.getElementById('admin-pass-input').value;

      const users = getAllUsers();
      const adminUser = users.find(u => u.email.toLowerCase() === loginId.toLowerCase() && u.password === password && u.role === 'admin');

      if (adminUser) {
        localStorage.setItem('akshar_current_user', JSON.stringify(adminUser));
        showToast('Administrator authenticated successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } else {
        showToast('Invalid administrator credentials! Use demo login.', 'error');
      }
    }
  </script>
</body>
</html>
