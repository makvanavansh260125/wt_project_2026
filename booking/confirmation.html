<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmation &amp; Travel Voucher | Akshar Tours &amp; Travels</title>
  
  <link rel="icon" type="image/svg+xml" href="../assets/logos/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="py-3 bg-white border-bottom shadow-sm no-print">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="../index.html">
        <img src="../assets/logos/logo.svg" alt="Akshar Tours &amp; Travels" height="44">
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-outline-navy btn-sm"><i class="bi bi-house me-1"></i> Home</a>
        <a href="../customer/dashboard.html" class="btn btn-gold btn-sm"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <main class="py-5">
    <div class="container" style="max-width: 900px;" id="confirmation-container">
      <!-- Injected by js/booking.js initConfirmationPage() -->
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Generating official travel confirmation voucher...</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-akshar no-print">
    <div class="container text-center">
      &copy; 2026 <strong>Akshar Tours &amp; Travels</strong>. All Rights Reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/booking.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initConfirmationPage('../');
    });
  </script>
</body>
</html>
