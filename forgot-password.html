<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password (Demo) | Akshar Tours &amp; Travels</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/logos/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html">
        <img src="assets/logos/logo.svg" alt="Akshar Tours &amp; Travels" height="44">
      </a>
      <a href="login.html" class="btn btn-outline-navy btn-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Back to Login
      </a>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">

          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="bg-navy p-4 text-white text-center">
              <i class="bi bi-shield-lock display-4 text-gold mb-2 d-block"></i>
              <h3 class="fw-bold mb-1">Reset Your Password</h3>
              <p class="text-white-50 small mb-0">Frontend Demo Password Reset Engine</p>
            </div>

            <div class="card-body p-4 p-md-5">
              <div class="alert alert-info py-2 px-3 mb-4 rounded-3 small">
                <i class="bi bi-info-circle-fill me-1"></i> Enter your registered email (e.g. <code>rahul.sharma@example.com</code>) to reset your password directly in LocalStorage.
              </div>

              <form onsubmit="return handleForgotPassword(event)">
                <div class="mb-3">
                  <label class="form-label fw-bold small text-navy">Registered Email or Mobile Number</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="text" name="identifier" class="form-control" placeholder="name@example.com or 9876543210" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold small text-navy">New Password (min 6 characters)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" name="newPassword" class="form-control" placeholder="Enter new password" minlength="6" required>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold small text-navy">Confirm New Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                    <input type="password" name="confirmNewPassword" class="form-control" placeholder="Repeat new password" required>
                  </div>
                </div>

                <button type="submit" class="btn btn-gold btn-lg w-100 py-2 fw-bold mb-3">
                  <i class="bi bi-arrow-clockwise me-1"></i> Update &amp; Reset Password
                </button>
              </form>

              <div class="text-center mt-3 pt-3 border-top small text-muted">
                Remembered your password? <a href="login.html" class="fw-bold text-royal">Sign In</a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
