<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Compass / Globe Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Golden Ring -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="40" cy="40" r="31" fill="#0A2540" stroke="#1E3A5F" stroke-width="1.5"/>
    
    <!-- Globe Lat/Long lines -->
    <ellipse cx="40" cy="40" rx="16" ry="30" fill="none" stroke="#2B4C7E" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="10" y1="40" x2="70" y2="40" stroke="#2B4C7E" stroke-width="1.2"/>
    <line x1="40" y1="10" x2="40" y2="70" stroke="#2B4C7E" stroke-width="1.2"/>

    <!-- Dynamic Flight Path Swoosh -->
    <path d="M 16 54 Q 40 12 66 22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Stylized Airplane -->
    <path d="M 66 22 L 62 14 L 68 20 L 75 19 L 70 23 L 73 28 L 68 25 L 66 28 Z" fill="url(#goldGrad)"/>
    
    <!-- Compass Pointer Star -->
    <polygon points="40,24 43,37 56,40 43,43 40,56 37,43 24,40 37,37" fill="url(#goldGrad)"/>
    <circle cx="40" cy="40" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography: AKSHAR -->
  <text x="102" y="47" font-family="'Plus Jakarta Sans', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#0A2540">AKSHAR</text>
  
  <!-- Accent dot/star in gold -->
  <circle cx="282" cy="35" r="4" fill="url(#goldGrad)"/>

  <!-- Typography: TOURS & TRAVELS -->
  <text x="104" y="68" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="13" letter-spacing="6.5" fill="#D4AF37">TOURS &amp; TRAVELS</text>
  
  <!-- Subtle Tagline -->
  <text x="325" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" letter-spacing="2" fill="#64748B">EXPLORE THE WORLD</text>
</svg>
